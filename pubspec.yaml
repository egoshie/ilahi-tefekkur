name: ilahi_tefekkur
description: "Huzur - Ilahi Metinler, Tefekkur ve Ibadet Ekosistemi V5.0 Production"
publish_to: 'none'
version: 5.0.0+10

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  http: ^1.6.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  shared_preferences: ^2.3.2
  adhan: ^2.0.0+1
  geolocator: ^13.0.1
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  just_audio: ^0.9.40
  audio_session: ^0.1.21
  sensors_plus: ^6.0.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  hijri: ^3.0.0
  in_app_purchase: ^3.2.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/seed_data.json
    - assets/audio/ney.wav
