name: Build Huzur iOS IPA (With Real WidgetExtension)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Inject HuzurWidgetExtension Target into Xcode Project
        run: |
          gem install xcodeproj --no-document
          ruby ios/add_widget_target.rb

      - name: Build iOS Release Unsigned App & WidgetExtension
        run: |
          flutter build ios --release --no-codesign
          echo "Verifying embedded WidgetExtension inside Runner.app/PlugIns:"
          ls -la build/ios/iphoneos/Runner.app/PlugIns || true

      - name: Package Unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r Huzur-Release.ipa Payload
          mkdir -p ../../../output_ipa
          cp Huzur-Release.ipa ../../../output_ipa/IlahiTefekkur-Release.ipa
          cp Huzur-Release.ipa ../../../output_ipa/Huzur-Release.ipa

      - name: Upload Huzur IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Huzur-iOS-Release-IPA
          path: output_ipa/Huzur-Release.ipa
