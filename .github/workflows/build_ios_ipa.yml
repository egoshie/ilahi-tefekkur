name: Build Huzur iOS IPA V4.1

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Add WidgetKit extension target
        run: |
          gem install xcodeproj --no-document
          ruby ios/fix_and_add_widget.rb

      - name: Build iOS release without signing
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        shell: bash
        run: |
          set -Eeuo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          WIDGET_PATH="$APP_PATH/PlugIns/HuzurWidgetExtension.appex"

          if [[ ! -d "$APP_PATH" ]]; then
            echo "Runner.app bulunamadi. Flutter iOS build ciktisini kontrol et."
            exit 1
          fi
          if [[ ! -d "$WIDGET_PATH" ]]; then
            echo "Widget extension Runner.app/PlugIns altina gomulmemis. Xcode target entegrasyonunu kontrol et."
            exit 1
          fi

          rm -rf package output_ipa
          mkdir -p package/Payload output_ipa
          cp -R "$APP_PATH" package/Payload/
          (cd package && /usr/bin/zip -qry ../output_ipa/Huzur-Release.ipa Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Huzur-iOS-V4.1-Release-IPA
          path: output_ipa/Huzur-Release.ipa
