name: Build Huzur iOS IPA V4.3

on:
  push:
    branches: [ "main", "master", "feature/huzur-v42" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Configure Zero-Cycle HuzurWidgetExtension Target
        run: |
          gem install xcodeproj --no-document
          ruby -c ios/fix_and_add_widget.rb
          ruby ios/fix_and_add_widget.rb

      - name: Build iOS Release App (--no-tree-shake-icons)
        run: |
          flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Build HuzurWidgetExtension via SYMROOT & Bundle into PlugIns
        run: |
          xcodebuild -project ios/Runner.xcodeproj \
            -target HuzurWidgetExtension \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$(pwd)/build/widget_sym" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p build/ios/iphoneos/Runner.app/PlugIns
          cp -R build/widget_sym/Release-iphoneos/HuzurWidgetExtension.appex build/ios/iphoneos/Runner.app/PlugIns/
          ls -la build/ios/iphoneos/Runner.app/PlugIns

      - name: Package Unsigned IPA
        run: |
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r Huzur-V4.3-Release.ipa Payload
          mkdir -p ../../../output_ipa
          cp Huzur-V4.3-Release.ipa ../../../output_ipa/Huzur-Release.ipa

      - name: Upload Huzur IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Huzur-iOS-V4.3-Release-IPA
          path: output_ipa/Huzur-Release.ipa
