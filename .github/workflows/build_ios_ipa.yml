name: Build iOS IPA (Release)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Flutter iOS & Install Pods
        run: |
          flutter pub get
          flutter build ios --config-only --release --no-codesign
          cd ios
          pod install

      - name: Build iOS Release Unsigned IPA
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -qq -r IlahiTefekkur-Release.ipa Payload
          mkdir -p $GITHUB_WORKSPACE/output_ipa
          mv IlahiTefekkur-Release.ipa $GITHUB_WORKSPACE/output_ipa/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IlahiTefekkur-Release-IPA
          path: output_ipa/IlahiTefekkur-Release.ipa
