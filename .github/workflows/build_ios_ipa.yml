name: Build Huzur iOS IPA V4.2

on:
  push:
    branches: [ "main", "master", "feature/huzur-v42" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Inject HuzurWidgetExtension into Xcode Project
        run: |
          gem install xcodeproj --no-document
          ruby -c ios/fix_and_add_widget.rb
          ruby ios/fix_and_add_widget.rb

      - name: Build iOS Release Unsigned App & WidgetExtension
        run: |
          flutter build ios --release --no-codesign
          if [ ! -d "build/ios/iphoneos/Runner.app/PlugIns/HuzurWidgetExtension.appex" ]; then
            xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -derivedDataPath build/ios_derived CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
            if [ -d "build/ios_derived/Build/Products/Release-iphoneos/HuzurWidgetExtension.appex" ]; then
              mkdir -p build/ios/iphoneos/Runner.app/PlugIns
              cp -R build/ios_derived/Build/Products/Release-iphoneos/HuzurWidgetExtension.appex build/ios/iphoneos/Runner.app/PlugIns/
            fi
          fi
          ls -la build/ios/iphoneos/Runner.app/PlugIns || true

      - name: Package Unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r Huzur-V4.2-Release.ipa Payload
          mkdir -p ../../../output_ipa
          cp Huzur-V4.2-Release.ipa ../../../output_ipa/Huzur-Release.ipa

      - name: Upload Huzur IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Huzur-iOS-V4.2-Release-IPA
          path: output_ipa/Huzur-Release.ipa
